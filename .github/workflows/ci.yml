# =============================================================================
# Threat Intelligence Pipeline — CI/CD Pipeline
# =============================================================================
# Triggers on push to main and pull requests.
# Stages: Lint → Test → Security Scan
# =============================================================================

name: 🛡️ CTI Pipeline CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Code Quality — Linting & Formatting
  # ---------------------------------------------------------------------------
  lint:
    name: 🧹 Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🖤 Check formatting with Black
        run: black --check --diff core/ utils/ config/ main.py tests/

      - name: 🔍 Lint with Flake8
        run: flake8 core/ utils/ config/ main.py tests/ --max-line-length=88 --extend-ignore=E203,W503 --statistics

  # ---------------------------------------------------------------------------
  # Stage 2: Testing — Unit Tests with Coverage
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          OPENSEARCH_URL: https://localhost:9200
          OPENSEARCH_USERNAME: admin
          OPENSEARCH_PASSWORD: test_password
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=core \
            --cov=utils \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: 📊 Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: 📋 Upload test results
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage 3: Security — Dependency & Secret Scanning
  # ---------------------------------------------------------------------------
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety bandit

      - name: 🔎 Audit dependencies (pip-audit)
        run: pip install -r requirements.txt && pip-audit --strict
        continue-on-error: true

      - name: 🛡️ Static security analysis (Bandit)
        run: bandit -r core/ utils/ config/ main.py -ll --format json --output bandit-report.json
        continue-on-error: true

      - name: 📄 Display Bandit results
        if: always()
        run: |
          if [ -f bandit-report.json ]; then
            python -m json.tool bandit-report.json
          else
            echo "No Bandit report generated"
          fi

      - name: 📊 Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Stage 4: Docker — Validate Compose Configuration
  # ---------------------------------------------------------------------------
  docker-validate:
    name: 🐳 Docker Compose Validate
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet
        env:
          OPENSEARCH_ADMIN_PASSWORD: validate_test_password

      - name: ✅ Compose file is valid
        run: echo "Docker Compose configuration is valid!"
